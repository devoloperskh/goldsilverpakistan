<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gold Silver Pakistan</title>

  <link rel="stylesheet" href="styles/style.css">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">🇵🇰</div>
      <h1>Gold & Silver</h1>
      <p>Live Rates • Pakistan</p>
    </header>

    <main>

      <!-- GOLD 24K -->
      <div class="rate-card gold-card">

        <div class="rate-title">
          <span class="metal-icon">🥇</span>

          <div>
            <h2>Gold 24K</h2>
            <p>Pure Gold</p>
          </div>
        </div>

        <div class="main-price">
          <span id="gold">Loading...</span>
          <small>PKR / Tola</small>
        </div>
        
<div class="movement" id="goldMovement">
  --
</div>
        <div class="gram-price">
          <span>Per Gram</span>
          <strong id="goldGram">--</strong>
        </div>

      </div>


      <!-- GOLD 22K -->
      <div class="rate-card gold-card">

        <div class="rate-title">
          <span class="metal-icon">💍</span>

          <div>
            <h2>Gold 22K</h2>
            <p>Jewellery Gold</p>
          </div>
        </div>

        <div class="main-price">
          <span id="gold22">Loading...</span>
          <small>PKR / Tola</small>
        </div>
        <div class="movement" id="gold22Movement">
  --
</div>

        <div class="gram-price">
          <span>Per Gram</span>
          <strong id="gold22Gram">--</strong>
        </div>

      </div>


      <!-- SILVER -->
      <div class="rate-card silver-card">

        <div class="rate-title">
          <span class="metal-icon">🥈</span>

          <div>
            <h2>Silver</h2>
            <p>Pure Silver</p>
          </div>
        </div>

        <div class="main-price">
          <span id="silver">Loading...</span>
          <small>PKR / Tola</small>
        </div>
        <div class="movement" id="silverMovement">
  --
</div>

        <div class="gram-price">
          <span>Per Gram</span>
          <strong id="silverGram">--</strong>
        </div>

      </div>


      <div class="updated-box">
        🕐 Last updated:
        <strong id="updated">--</strong>
      </div>

    </main>

    <footer>
      <p>Rates are provided for information purposes.</p>
    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
