<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gold & Silver Rates</title>

  <link rel="stylesheet" href="styles/style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>🥇 Gold & Silver</h1>
      <p>Live Market Rates</p>
    </header>

    <main>

      <div class="card gold">
        <div class="icon">🥇</div>
        <div>
          <h2>Gold</h2>
          <p>24K Gold</p>
        </div>

        <div class="price">
          <span id="goldPrice">Loading...</span>
          <small>PKR / Tola</small>
        </div>
      </div>


      <div class="card silver">
        <div class="icon">🥈</div>
        <div>
          <h2>Silver</h2>
          <p>Pure Silver</p>
        </div>

        <div class="price">
          <span id="silverPrice">Loading...</span>
          <small>PKR / Tola</small>
        </div>
      </div>


      <div class="details">

        <div>
          <span>Gold / Gram</span>
          <strong id="goldGram">--</strong>
        </div>

        <div>
          <span>Silver / Gram</span>
          <strong id="silverGram">--</strong>
        </div>

      </div>


      <button onclick="refreshRates()">
        🔄 Refresh Rates
      </button>

      <p class="updated">
        Last updated: <span id="updated">--</span>
      </p>

    </main>

  </div>

  <script src="script.js"></script>

</body>
</html>
